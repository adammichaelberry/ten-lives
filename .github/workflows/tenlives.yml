name: Ten Lives
on:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "0 2,5,11,14 * * 6"
    - cron: "*/5 * * * 4,5,6,0"
    - cron: "0 20 * * 0"
    - cron: "0 5 * * 4"
  workflow_dispatch:
    inputs:
      task:
        description: what to run
        type: choice
        default: data
        options: [data, report, bulletin, gameday]
permissions:
  contents: write
concurrency: data
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SHEET_URL: ${{ secrets.SHEET_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      MOVE_ALERT: ${{ vars.MOVE_ALERT }}
      QUIET_HOURS: ${{ vars.QUIET_HOURS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: task
        run: |
          t=data
          case "${{ github.event.schedule }}" in
            "*/5 * * * 4,5,6,0") t=gameday ;;
            "0 20 * * 0") t=report ;;
            "0 5 * * 4") t=bulletin ;;
          esac
          if [ -n "${{ github.event.inputs.task }}" ]; then t="${{ github.event.inputs.task }}"; fi
          echo "task=$t" >> "$GITHUB_OUTPUT"
      - run: pip install requests openpyxl numpy scipy
      - name: Update data + odds alerts
        if: steps.task.outputs.task != 'gameday'
        run: python fetch_data.py --notify
      - name: Weekly report
        if: steps.task.outputs.task == 'report'
        run: python report.py
      - name: Thursday bulletin
        if: steps.task.outputs.task == 'bulletin'
        run: python bulletin.py
      - name: Game-day pings
        if: steps.task.outputs.task == 'gameday'
        run: python gameday.py
      - name: Commit
        if: steps.task.outputs.task != 'gameday'
        run: |
          git config user.name ten-lives-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m bot-update
          git push
